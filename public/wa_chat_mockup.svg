<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="380" height="460">
  <rect width="380" height="460" rx="24" fill="#efeae2"/>
  
  <!-- WhatsApp Top Header -->
  <rect width="380" height="70" rx="24" fill="#075e54"/>
  <circle cx="44" cy="38" r="20" fill="#25d366"/>
  <text x="44" y="45" font-family="Montserrat, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">S</text>
  <text x="76" y="34" font-family="Montserrat, sans-serif" font-weight="800" font-size="13" fill="#ffffff">Saudade Recordatorios</text>
  <text x="76" y="50" font-family="Montserrat, sans-serif" font-weight="500" font-size="10" fill="#bbf7d0">Cuenta oficial verificada ✓</text>
  
  <!-- Outgoing Message from Clinic -->
  <g transform="translate(40, 95)">
    <rect width="300" height="150" rx="14" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="16" y="24" font-family="Montserrat, sans-serif" font-weight="700" font-size="11.5" fill="#021a50">Hola Carlos, buen día 👋</text>
    <text x="16" y="44" font-family="Montserrat, sans-serif" font-weight="500" font-size="10.5" fill="#334155">Te recordamos tu sesión de psicoterapia:</text>
    <text x="16" y="68" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#075e54">📅 Hoy a las 4:00 PM</text>
    <text x="16" y="86" font-family="Montserrat, sans-serif" font-weight="500" font-size="10.5" fill="#334155">Dra. Marcela González · Consultorio 4</text>
    <text x="16" y="110" font-family="Montserrat, sans-serif" font-weight="500" font-size="10" fill="#64748b">Por favor responde para confirmar:</text>
    <!-- Buttons -->
    <rect x="16" y="120" width="125" height="22" rx="6" fill="#dcf8c6" stroke="#25d366" stroke-width="1"/>
    <text x="78" y="135" font-family="Montserrat, sans-serif" font-weight="700" font-size="9" fill="#075e54" text-anchor="middle">1. Confirmar asistencia</text>
    <rect x="150" y="120" width="110" height="22" rx="6" fill="#f1f5f9"/>
    <text x="205" y="135" font-family="Montserrat, sans-serif" font-weight="600" font-size="9" fill="#475569" text-anchor="middle">2. Reagendar cita</text>
    <text x="280" y="142" font-family="Montserrat, sans-serif" font-size="8.5" fill="#94a3b8">10:00 AM</text>
  </g>

  <!-- Incoming Message from Patient -->
  <g transform="translate(140, 275)">
    <rect width="200" height="65" rx="14" fill="#dcf8c6" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="16" y="24" font-family="Montserrat, sans-serif" font-weight="600" font-size="11" fill="#0f172a">1. Confirmar asistencia</text>
    <text x="16" y="44" font-family="Montserrat, sans-serif" font-weight="500" font-size="10.5" fill="#075e54">¡Listo! Ahí estaré puntual, gracias.</text>
    <text x="175" y="58" font-family="Montserrat, sans-serif" font-size="8.5" fill="#65a30d">10:04 AM ✓✓</text>
  </g>

  <!-- Auto Confirmation Bubble -->
  <g transform="translate(40, 365)">
    <rect width="300" height="70" rx="14" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="16" y="24" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#021a50">✓ Cita confirmada automáticamente</text>
    <text x="16" y="42" font-family="Montserrat, sans-serif" font-weight="500" font-size="10" fill="#64748b">Tu agenda de Saudade ha sido actualizada.</text>
    <text x="16" y="58" font-family="Montserrat, sans-serif" font-weight="600" font-size="9.5" fill="#25d366">Sin llamadas manuales ni inasistencias.</text>
  </g>
</svg>